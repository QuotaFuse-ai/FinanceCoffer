name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同仓 PR 门禁用仓库内置 GITHUB_TOKEN，不需要任何 secret（QUOT-238 决定②）。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest / ruff / mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 公开面卫生检查：与提交前钩子跑同一份脚本，不复刻规则。放在 Install 之前
      # 是因为脚本只用标准库，违规内容不必等依赖装完才报（DEC-0030）。
      - name: public-docs
        run: python tools/check_public_docs.py

      - name: Install
        run: python -m pip install -e ".[all,dev,s3]"

      - name: pytest
        run: python -m pytest -o addopts=""

      - name: ruff
        run: python -m ruff check .

      # 009398c 起就有 24 条既有 mypy 错误（QUOT-244 已用同基线 diff 证明非本次引入），
      # 先不阻断合并；清账后把 continue-on-error 去掉即可变成硬门禁。
      - name: mypy
        continue-on-error: true
        run: python -m mypy
