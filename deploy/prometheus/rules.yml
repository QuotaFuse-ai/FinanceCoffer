# Alert rules for the metrics named in docs/specs/cli.md section 3.14.
groups:
  - name: financecoffer
    rules:
      - alert: FinanceCofferEtlConsumeLagHigh
        expr: fc_etl_consume_lag_seconds > 60
        for: 5m
        labels:
          severity: warning
          service: financecoffer
        annotations:
          summary: "ETL consumer lag above 60 seconds"
          description: >-
            The oldest event still marked received/processing has been queued
            for {{ $value }} seconds (measured from received_at). Either the
            worker stopped consuming, or an event was reset to the queued state
            and nothing re-delivered it.

      - alert: FinanceCofferEtlEventsFailed
        expr: increase(fc_etl_events_total{status="failed"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: financecoffer
        annotations:
          summary: "ETL event failures increasing"
          description: >-
            {{ $value }} events per second failed within the last five minutes.
            Inspect the dead-letter queue and upstream payload quality.

      # No sampling point in the shipped topology: the counter lives in the
      # ingest process, not in the API that serves /metrics. See deploy/README.md
      # section "监控" before trusting this rule to fire.
      - alert: FinanceCofferMissingChunk
        expr: fc_missing_chunk_total > 0
        for: 1m
        labels:
          severity: critical
          service: financecoffer
        annotations:
          summary: "Missing announcement chunks detected"
          description: >-
            {{ $value }} chunk gaps were reported. Re-run the chunking job for
            the affected symbols before serving retrieval results.

      - alert: FinanceCofferArchiveJobFailed
        expr: increase(fc_archive_job_total{status="failed"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: financecoffer
        annotations:
          summary: "Archive jobs failing"
          description: >-
            {{ $value }} archive jobs per second failed within the last five
            minutes. Verify MinIO reachability and bucket permissions.

      # No pool alert on purpose: this product exposes no pool metric family, so
      # any such rule would stay silent forever. Rationale: docs/specs/financecoffer.md §7.
