[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financecoffer"
dynamic = ["version"]
description = "FinanceCoffer - financial data warehouse and hybrid retrieval for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "QuotaFuse AI" }]
keywords = ["finance", "data-warehouse", "pgvector", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
]
db = [
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "alembic>=1.13,<2",
]
etl = [
  "redis>=5,<7",
]
vector = [
  "pgvector>=0.2,<1",
  "httpx>=0.27,<1",
]
minio = [
  "minio>=7,<8",
]
mcp = [
  "mcp>=2,<3",
]
admin = [
  "starlette>=0.37,<1",
  "jinja2>=3.1,<4",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "httpx>=0.27,<1",
  "fastapi>=0.110,<1",
]
all = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "alembic>=1.13,<2",
  "redis>=5,<7",
  "pgvector>=0.2,<1",
  "httpx>=0.27,<1",
  "minio>=7,<8",
  "mcp>=2,<3",
  "starlette>=0.37,<1",
  "jinja2>=3.1,<4",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
fcoffer = "financecoffer.cli:main"

[project.urls]
Documentation = "https://github.com/QuotaFuse-ai/FinanceCoffer#readme"

[tool.setuptools.dynamic]
version = { attr = "financecoffer.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
financecoffer = ["py.typed", "db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["financecoffer"]
strict = true
warn_unused_ignores = true
